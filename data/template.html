<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PCD_TITLE__</title>
<style>
__PCD_FONTS__
/* ====================== charte Add-On - design tokens ====================== */
:root{
  --font: 'Poppins', 'Segoe UI', ui-sans-serif, -apple-system, Roboto, Arial, sans-serif;
  --mono: ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, monospace;
  --r-sm:6px; --r-md:10px; --r-lg:12px;

  /* couleurs de marque */
  --brand:#3E2C87; --brand-d:#2E2065; --brand-l:#5B45B8;
  --red:#D60929; --blue:#0095EB; --ink:#292B33;

  /* échelle de criticité : ancrée sur la marque (N1 rouge Add-On, N5 bleu Add-On) */
  --l1:#D60929; --l2:#E8720C; --l3:#E0A800; --l4:#2E9E5B; --l5:#0095EB;
  --good:#2E9E5B; --bad:#D60929; --flat:#8A8A93;
}
html[data-theme="light"]{
  --bg:#F3F5F7; --bg-alt:#FFFFFF;
  --surface:#FFFFFF; --surface-2:#F9FAFA; --surface-3:#F2F2F2;
  --border:#E3E1E8; --border-soft:#EDEEF2;
  --text:#212529; --text-2:#626262; --muted:#8A8A93;
  --accent:var(--brand); --accent-2:var(--blue); --accent-soft:#3E2C8714;
  --grid:#21252910;
  --shadow: 0 1px 2px rgba(41,43,51,.05), 0 8px 22px -14px rgba(41,43,51,.22);
}
html[data-theme="dark"]{
  --bg:#191B22; --bg-alt:#20232C;
  --surface:#23262F; --surface-2:#2A2E39; --surface-3:#343846;
  --border:#343846; --border-soft:#2C303B;
  --text:#F1F2F5; --text-2:#B8BAC4; --muted:#8A8D99;
  --accent:#7C68D6; --accent-2:#3FAEF2; --accent-soft:#7C68D628;
  --grid:#FFFFFF12;
  --shadow: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px -14px rgba(0,0,0,.5);
  --l1:#F0455F; --l2:#F08A2E; --l3:#E9BE2A; --l4:#41B473; --l5:#3FAEF2;
  --good:#41B473; --bad:#F0455F;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-2); text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--mono);font-size:.92em;background:var(--surface-3);padding:1px 5px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ============================== layout ============================== */
.app{display:grid; grid-template-columns:270px 1fr; min-height:100vh}
.sidebar{
  background:var(--bg-alt); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:22px 20px 18px; border-bottom:1px solid var(--border-soft)}
.brand img{height:34px;width:auto;display:block}
/* repli typographique si aucun fichier logo n'est fourni */
.wordmark{
  display:inline-block;font-size:25px;font-weight:700;letter-spacing:-.02em;
  color:var(--brand);line-height:1;
}
.wordmark em{font-style:normal;color:var(--red)}
html[data-theme="dark"] .wordmark{color:#fff}
.brand .tag{
  margin-top:12px; font-size:11px; font-weight:600; letter-spacing:.10em;
  text-transform:uppercase; color:var(--brand);
}
html[data-theme="dark"] .brand img{filter:brightness(0) invert(1)}
html[data-theme="dark"] .brand .tag{color:var(--accent)}
.brand .tag small{display:block;font-size:10.5px;font-weight:400;letter-spacing:.02em;
  text-transform:none;color:var(--muted);margin-top:3px}
.nav{padding:10px 12px 18px; flex:1}
.nav-label{
  font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted);
  padding:14px 8px 7px; font-weight:600;
}
.nav a{
  display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:var(--r-md);
  color:var(--text-2); font-size:13px; font-weight:500; margin-bottom:2px; cursor:pointer;
  border-left:3px solid transparent;
}
.nav a:hover{background:var(--surface-3); color:var(--text); text-decoration:none}
.nav a.active{
  background:var(--accent-soft); color:var(--brand); font-weight:600; border-left-color:var(--brand);
}
html[data-theme="dark"] .nav a.active{color:var(--text); border-left-color:var(--accent)}
.nav a .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.45;flex:0 0 auto}
.nav a.active .dot{opacity:1}
.nav a .tail{margin-left:auto; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; font-weight:600}
.sidebar-foot{padding:14px 20px; border-top:1px solid var(--border); font-size:11px; color:var(--muted)}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px;
  padding:14px 30px; background:var(--bg-alt); border-bottom:1px solid var(--border);
}
.crumb{font-size:11.5px;color:var(--muted);font-weight:500}
.topbar h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--text)}
.topbar .spacer{flex:1}
.content{padding:26px 30px 60px; max-width:1560px; width:100%}

/* ============================== atomes ============================== */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r-md);
  background:var(--surface); border:1px solid var(--border); color:var(--text-2);
  font:inherit; font-size:12.5px; font-weight:500; cursor:pointer;
}
.btn:hover{background:var(--surface-3); color:var(--text); border-color:var(--brand)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn.primary:hover{background:var(--brand-d); border-color:var(--brand-d); color:#fff}
.btn svg{width:15px;height:15px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:600;background:var(--surface-3);color:var(--text-2);white-space:nowrap;
}
.chip.lv1{background:rgba(214,9,41,.12);color:var(--l1)}
.chip.lv2{background:rgba(232,114,12,.13);color:var(--l2)}
.chip.lv3{background:rgba(224,168,0,.15);color:#9C7500}
.chip.lv4{background:rgba(46,158,91,.13);color:var(--l4)}
.chip.lv5{background:rgba(0,149,235,.13);color:var(--l5)}
html[data-theme="dark"] .chip.lv3{color:var(--l3)}
/* criticité inconnue : discret, sans pastille */
.lv-na{color:var(--muted);font-weight:500;font-size:12px;padding-left:7px;cursor:help}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  box-shadow:var(--shadow);
}
.card > header{
  display:flex;align-items:baseline;gap:4px 10px;padding:15px 18px;
  border-bottom:1px solid var(--border-soft);flex-wrap:wrap;
}
/* sur une carte étroite, le sous-titre bascule sur sa propre ligne
   au lieu de se serrer contre le titre */
.card > header h3{margin:0;font-size:13.5px;font-weight:600;color:var(--text);letter-spacing:-.005em;flex:0 0 auto}
.card > header .sub{font-size:11.5px;color:var(--muted);font-weight:400}
.card .body{padding:18px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1250px){.g4,.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto}
  .g2,.g3,.g4,.g6{grid-template-columns:1fr}.content,.topbar{padding-left:16px;padding-right:16px}}
.section-title{
  display:flex;align-items:center;gap:11px;margin:32px 0 15px;font-size:12px;font-weight:600;
  text-transform:uppercase;letter-spacing:.10em;color:var(--brand);
}
html[data-theme="dark"] .section-title{color:var(--accent)}
.section-title::before{content:"";width:3px;height:14px;background:var(--brand);border-radius:2px;flex:0 0 auto}
html[data-theme="dark"] .section-title::before{background:var(--accent)}
.section-title::after{content:"";flex:1;height:1px;background:var(--border)}
.section-title:first-child{margin-top:0}

/* ============================== KPI ============================== */
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .label{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.kpi .value{font-size:27px;font-weight:600;letter-spacing:-.025em;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--text)}
.kpi .value small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi .foot{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-variant-numeric:tabular-nums}
.delta svg{width:12px;height:12px}
.delta.up{color:var(--bad)} .delta.down{color:var(--good)} .delta.flat{color:var(--flat)}

/* ============================== tableaux ============================== */
.tbl-tools{display:flex;align-items:center;gap:8px;padding:0 0 12px;flex-wrap:wrap}
.search{
  flex:1;max-width:290px;display:flex;align-items:center;gap:8px;padding:7px 11px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);
}
.search:focus-within{border-color:var(--brand)}
.search svg{width:14px;height:14px;color:var(--muted);flex:0 0 auto}
.search input{border:0;background:transparent;color:var(--text);font:inherit;font-size:12.5px;width:100%;outline:none}
.tbl-wrap{overflow-x:auto;border-radius:var(--r-md);border:1px solid var(--border-soft)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{
  position:sticky;top:0;background:var(--surface-3);text-align:left;font-weight:600;color:var(--text-2);
  padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--border);cursor:pointer;
  user-select:none;font-size:11px;text-transform:uppercase;letter-spacing:.05em;z-index:1;
}
thead th:hover{color:var(--brand)}
thead th .arw{opacity:.3;margin-left:4px;font-size:9px}
thead th.sorted{color:var(--brand)}
thead th.sorted .arw{opacity:1}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border-soft);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
tbody tr.dim td{color:var(--muted);opacity:.6}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.rid{font-family:var(--mono);font-size:11.5px;white-space:nowrap;color:var(--text)}
td.rat{color:var(--text-2);min-width:240px}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:12.5px}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding-top:10px;font-size:12px;color:var(--muted)}
.pager button{padding:4px 10px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;font:inherit;font-size:12px}
.pager button:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.pager button:disabled{opacity:.4;cursor:default}
.hm{display:inline-block;min-width:30px;text-align:center;padding:2px 6px;border-radius:var(--r-sm);font-variant-numeric:tabular-nums;font-weight:600;font-size:11.5px}

/* ============================== graphiques ============================== */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);cursor:pointer;user-select:none}
.legend span.off{opacity:.35}
.legend i{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.tip{
  position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:#F1F2F5;
  border-radius:var(--r-md);padding:9px 11px;font-size:12px;
  box-shadow:0 8px 24px -8px rgba(0,0,0,.45);opacity:0;transition:opacity .1s;min-width:130px;
}
.tip.on{opacity:1}
.tip .t{font-weight:600;margin-bottom:5px;font-size:11.5px;color:#fff}
.tip .r{display:flex;align-items:center;gap:7px;color:#C9CBD4}
.tip .r b{margin-left:auto;color:#fff;font-variant-numeric:tabular-nums}
.tip i{width:8px;height:8px;border-radius:2px;flex:0 0 auto}

.gauge{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.gauge .g-val{font-size:26px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.gauge .g-lab{font-size:12.5px;font-weight:600;color:var(--text)}
.gauge .g-sub{font-size:11px;color:var(--muted);text-align:center;max-width:210px}

.timeline{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 10px}
.tl-item{
  flex:0 0 auto;min-width:120px;padding:11px 13px;border-radius:var(--r-md);cursor:pointer;
  background:var(--surface);border:1px solid var(--border);
}
.tl-item:hover{border-color:var(--brand)}
.tl-item.active{border-color:var(--brand);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.tl-item .d{font-size:12px;font-weight:600;color:var(--text)}
.tl-item .p{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:2px}

/* rappel affiché juste avant l'ouverture de la boîte d'impression */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
  z-index:80;display:flex;align-items:center;gap:11px;max-width:min(560px,92vw);
  padding:13px 17px;border-radius:var(--r-lg);background:var(--ink);color:#F1F2F5;
  font-size:12.5px;line-height:1.5;box-shadow:0 12px 34px -12px rgba(0,0,0,.55);
  opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:19px;height:19px;flex:0 0 auto;color:#fff}
.toast b{color:#fff;font-weight:600}
@media print{.toast{display:none!important}}

.note{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.6}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:980px){.split{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:12.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;text-align:right;color:var(--text)}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12px;padding:5px 0}
.bar-row .nm{width:150px;flex:0 0 auto;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .tr{flex:1;height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar-row .fl{height:100%;border-radius:99px}
.bar-row .vl{width:56px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;flex:0 0 auto;color:var(--text)}

/* ====================== couverture + mise en page PDF ====================== */
.cover{display:none}
.pdf-foot{display:none}

body.print-mode{background:#fff}
body.print-mode .sidebar,
body.print-mode .topbar{display:none}
body.print-mode .app{grid-template-columns:1fr}
body.print-mode .content{max-width:none;padding:0}
body.print-mode .cover{
  display:flex;flex-direction:column;justify-content:space-between;
  min-height:247mm;padding:4mm 0 6mm;break-after:page;
}
body.print-mode .cover .c-top img{height:52px;width:auto}
body.print-mode .cover .c-mid{padding:0 0 30mm}
body.print-mode .cover .c-kicker{
  font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);
}
body.print-mode .cover h1{
  font-size:34px;font-weight:600;letter-spacing:-.02em;margin:10px 0 6px;color:var(--ink);line-height:1.2;
}
body.print-mode .cover .c-sub{font-size:15px;color:var(--text-2);margin-bottom:26px}
body.print-mode .cover .c-rule{height:4px;width:64px;background:var(--red);border-radius:2px;margin-bottom:26px}
body.print-mode .cover .kv{max-width:420px;grid-template-columns:auto 1fr;font-size:13px}
body.print-mode .cover .kv dd{text-align:left;font-weight:600}
body.print-mode .cover .c-foot{
  font-size:10.5px;color:var(--muted);border-top:1px solid var(--border);padding-top:10px;line-height:1.6;
}
body.print-mode .pdf-foot{
  display:block;margin-top:14mm;padding-top:8px;border-top:1px solid var(--border);
  font-size:9.5px;color:var(--muted);
}
body.print-mode .sec-break{break-before:page}
body.print-mode .card{box-shadow:none;break-inside:avoid}
body.print-mode .tbl-wrap{overflow:visible}
body.print-mode thead th{position:static}
body.print-mode .timeline{display:none}
body.print-mode .section-title{margin-top:22px}
body.print-mode .doc-h{
  display:flex;align-items:center;gap:12px;margin:0 0 18px;padding-bottom:12px;
  border-bottom:2px solid var(--brand);break-after:avoid;
}
body.print-mode .doc-h .dh-t{font-size:20px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
body.print-mode .doc-h .dh-s{font-size:12px;color:var(--muted);margin-left:auto}

@media print{
  html,body{background:#fff}
  .sidebar,.topbar,.tbl-tools,.pager,.timeline{display:none!important}
  .app{grid-template-columns:1fr}
  .content{padding:0;max-width:none}
  .card{break-inside:avoid;box-shadow:none;border-color:#DDD}
  .grid{gap:10px}
  thead{display:table-header-group}
  tbody tr{break-inside:avoid}
  .section-title{break-after:avoid}
  a{color:inherit;text-decoration:none}
}
@page{size:A4;margin:14mm 12mm 12mm}
/* les aplats de couleur (criticités, cartes) doivent survivre à l'impression */
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      __PCD_BRAND__
      <div class="tag">PingCastle Trend<small>Suivi de sécurité Active Directory</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="sidefoot"></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div><div class="crumb" id="crumb"></div><h2 id="ptitle"></h2></div>
      <div class="spacer"></div>
      <button class="btn" id="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg><span>Thème</span></button>
      <button class="btn primary" id="printbtn"
        title="Ouvre la boîte d’impression du navigateur. Choisissez « Enregistrer au format PDF » comme destination.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>
        <span>Imprimer / PDF</span></button>
    </div>
    <div class="content">
      <div class="cover" id="cover"></div>
      <div id="view"></div>
      <div class="pdf-foot" id="pdffoot"></div>
    </div>
  </div>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
  <span>Dans la boîte d’impression, choisissez <b>« Enregistrer au format PDF »</b> comme destination.<br>
  Pour un PDF généré directement sur le disque : <b>New-PingCastleDashboard.ps1 -Pdf</b></span>
</div>
<script>
"use strict";
var PCD = __PCD_DATA__;
var PCD_LOGO = "__PCD_LOGO__";
</script>
<script>
__PCD_APP__
</script>
</body>
</html>
