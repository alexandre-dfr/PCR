<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PCD_TITLE__</title>
<style>
/* ============================ design tokens ============================ */
:root{
  --font: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --l1:#ef4444; --l2:#f97316; --l3:#eab308; --l4:#22c55e; --l5:#38bdf8;
  --good:#22c55e; --bad:#ef4444; --flat:#8b93a7;
  --shadow: 0 1px 2px rgba(0,0,0,.20), 0 8px 24px -12px rgba(0,0,0,.35);
}
html[data-theme="dark"]{
  --bg:#0a0d14; --bg-alt:#0e121b;
  --surface:#141926; --surface-2:#1b2130; --surface-3:#232a3c;
  --border:#242b3b; --border-soft:#1c2231;
  --text:#e8ebf2; --text-2:#aeb6c8; --muted:#7c8598;
  --accent:#7c6cff; --accent-2:#4f8cff; --accent-soft:#7c6cff26;
  --grid:#ffffff0f;
}
html[data-theme="light"]{
  --bg:#f4f6fa; --bg-alt:#eef1f7;
  --surface:#ffffff; --surface-2:#f7f9fc; --surface-3:#eef2f8;
  --border:#dfe4ee; --border-soft:#e9edf4;
  --text:#141a26; --text-2:#454e60; --muted:#6b7488;
  --accent:#5b4bdb; --accent-2:#2f6fe4; --accent-soft:#5b4bdb1a;
  --grid:#0000000f;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 10px 26px -14px rgba(16,24,40,.25);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-2); text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:8px; border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ============================ layout ============================ */
.app{display:grid; grid-template-columns:264px 1fr; min-height:100vh}
.sidebar{
  background:var(--bg-alt); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:20px 18px 16px}
.brand .mark{
  width:34px;height:34px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;color:#fff;
}
.brand .mark svg{width:19px;height:19px}
.brand h1{font-size:14px;margin:0;font-weight:650;letter-spacing:-.01em}
.brand p{margin:0;font-size:11px;color:var(--muted)}
.nav{padding:6px 10px 18px; flex:1}
.nav-label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted);
  padding:14px 8px 6px; font-weight:600;
}
.nav a{
  display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:var(--r-md);
  color:var(--text-2); font-size:13px; font-weight:500; margin-bottom:2px; cursor:pointer;
}
.nav a:hover{background:var(--surface); color:var(--text); text-decoration:none}
.nav a.active{background:var(--accent-soft); color:var(--text); font-weight:600}
.nav a .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5;flex:0 0 auto}
.nav a.active .dot{opacity:1;background:var(--accent)}
.nav a .tail{margin-left:auto; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.sidebar-foot{padding:14px 18px; border-top:1px solid var(--border); font-size:11px; color:var(--muted)}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px;
  padding:14px 28px; background:var(--bg); border-bottom:1px solid var(--border-soft);
}
.crumb{font-size:12px;color:var(--muted)}
.topbar h2{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
.topbar .spacer{flex:1}
.content{padding:24px 28px 56px; max-width:1520px; width:100%}

/* ============================ atoms ============================ */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:var(--r-md);
  background:var(--surface); border:1px solid var(--border); color:var(--text-2);
  font:inherit; font-size:12.5px; font-weight:550; cursor:pointer;
}
.btn:hover{background:var(--surface-2); color:var(--text)}
.btn svg{width:15px;height:15px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:600;background:var(--surface-3);color:var(--text-2);
  white-space:nowrap;
}
.chip.lv1{background:rgba(239,68,68,.16);color:var(--l1)}
.chip.lv2{background:rgba(249,115,22,.16);color:var(--l2)}
.chip.lv3{background:rgba(234,179,8,.18);color:var(--l3)}
.chip.lv4{background:rgba(34,197,94,.16);color:var(--l4)}
.chip.lv5{background:rgba(56,189,248,.16);color:var(--l5)}
.chip.ok{background:rgba(34,197,94,.16);color:var(--good)}
.chip.ko{background:rgba(239,68,68,.16);color:var(--bad)}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  box-shadow:var(--shadow);
}
.card > header{
  display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border-soft);
}
.card > header h3{margin:0;font-size:13.5px;font-weight:650;letter-spacing:-.005em}
.card > header .sub{font-size:11.5px;color:var(--muted);font-weight:400}
.card > header .spacer{flex:1}
.card .body{padding:18px}
.card .body.tight{padding:10px 14px 14px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1250px){.g4,.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto}
  .g2,.g3,.g4,.g6{grid-template-columns:1fr}.content,.topbar{padding-left:16px;padding-right:16px}}
.section-title{
  display:flex;align-items:center;gap:10px;margin:30px 0 14px;font-size:12px;font-weight:650;
  text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
}
.section-title::after{content:"";flex:1;height:1px;background:var(--border-soft)}
.section-title:first-child{margin-top:0}

/* ============================ KPI ============================ */
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .label{font-size:11.5px;color:var(--muted);font-weight:550;letter-spacing:.01em}
.kpi .value{font-size:27px;font-weight:680;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .value small{font-size:13px;font-weight:550;color:var(--muted);margin-left:2px}
.kpi .foot{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:650;font-variant-numeric:tabular-nums}
.delta svg{width:12px;height:12px}
.delta.up{color:var(--bad)} .delta.down{color:var(--good)} .delta.flat{color:var(--flat)}

/* ============================ tables ============================ */
.tbl-tools{display:flex;align-items:center;gap:8px;padding:0 0 12px;flex-wrap:wrap}
.search{
  flex:1;max-width:280px;display:flex;align-items:center;gap:7px;padding:6px 10px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);
}
.search svg{width:14px;height:14px;color:var(--muted);flex:0 0 auto}
.search input{
  border:0;background:transparent;color:var(--text);font:inherit;font-size:12.5px;width:100%;outline:none;
}
.tbl-wrap{overflow-x:auto;border-radius:var(--r-md);border:1px solid var(--border-soft)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{
  position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:620;color:var(--text-2);
  padding:9px 12px;white-space:nowrap;border-bottom:1px solid var(--border);cursor:pointer;
  user-select:none;font-size:11.5px;z-index:1;
}
thead th:hover{color:var(--text)}
thead th .arw{opacity:.35;margin-left:4px;font-size:9px}
thead th.sorted .arw{opacity:1;color:var(--accent)}
tbody td{padding:8px 12px;border-bottom:1px solid var(--border-soft);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
tbody tr.dim td{color:var(--muted);opacity:.62}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.rid{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
td.rat{color:var(--text-2);min-width:240px}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:12.5px}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding-top:10px;font-size:12px;color:var(--muted)}
.pager button{padding:4px 9px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;font:inherit;font-size:12px}
.pager button:disabled{opacity:.4;cursor:default}
.hm{display:inline-block;min-width:30px;text-align:center;padding:2px 5px;border-radius:var(--r-sm);font-variant-numeric:tabular-nums;font-weight:600;font-size:11.5px}

/* ============================ charts ============================ */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);cursor:pointer;user-select:none}
.legend span.off{opacity:.35}
.legend i{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.tip{
  position:fixed;z-index:60;pointer-events:none;background:var(--surface-3);
  border:1px solid var(--border);border-radius:var(--r-md);padding:8px 10px;font-size:12px;
  box-shadow:var(--shadow);opacity:0;transition:opacity .1s;min-width:120px;
}
.tip.on{opacity:1}
.tip .t{font-weight:650;margin-bottom:5px;font-size:11.5px;color:var(--text)}
.tip .r{display:flex;align-items:center;gap:7px;color:var(--text-2)}
.tip .r b{margin-left:auto;color:var(--text);font-variant-numeric:tabular-nums}
.tip i{width:8px;height:8px;border-radius:2px;flex:0 0 auto}

.gauge{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.gauge .g-val{font-size:26px;font-weight:680;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gauge .g-lab{font-size:12.5px;font-weight:600}
.gauge .g-sub{font-size:11px;color:var(--muted);text-align:center;max-width:210px}

.timeline{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}
.tl-item{
  flex:0 0 auto;min-width:112px;padding:10px 12px;border-radius:var(--r-md);cursor:pointer;
  background:var(--surface);border:1px solid var(--border);
}
.tl-item:hover{border-color:var(--accent)}
.tl-item.active{border-color:var(--accent);background:var(--accent-soft)}
.tl-item .d{font-size:12px;font-weight:640}
.tl-item .p{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:2px}

.note{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.55}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:980px){.split{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:12.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:560;text-align:right}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12px;padding:5px 0}
.bar-row .nm{width:150px;flex:0 0 auto;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .tr{flex:1;height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar-row .fl{height:100%;border-radius:99px}
.bar-row .vl{width:56px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;flex:0 0 auto}

@media print{
  .sidebar,.topbar .btn,.tbl-tools,.pager{display:none!important}
  .app{grid-template-columns:1fr}.card{break-inside:avoid;box-shadow:none}
  body{background:#fff}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
      <div><h1>PingCastle Trend</h1><p>Analyse d&#39;&eacute;volution AD</p></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="sidefoot"></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div><div class="crumb" id="crumb"></div><h2 id="ptitle"></h2></div>
      <div class="spacer"></div>
      <button class="btn" id="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg><span>Theme</span></button>
      <button class="btn" id="printbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg><span>Imprimer</span></button>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<div class="tip" id="tip"></div>
<script>
